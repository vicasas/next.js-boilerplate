name: 🐛 Bug report
description: Report something that is not working as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        🙏 Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.
  - type: checkboxes
    id: latest-version
    attributes:
      label: Latest version
      description: New releases include bug fixes, performance improvements, and other changes.
      options:
        - label: I have tested the latest version.
          required: true
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔁 Steps to reproduce
      description: Describe the steps needed to reproduce the issue reliably.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: reproduction-link
    attributes:
      label: 🔗 Minimal reproduction
      description: If possible, provide a link to a minimal repository that reproduces the issue.
      placeholder: https://github.com/username/repository
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual behavior
      description: What happened instead? Include error messages or logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 💻 Environment
      description: |
        Run `npx next info` from the project root and include its output, along with your `tsconfig.json` configuration.
        If the issue is browser-related, specify the browser and its version.
      value: |
        ### Next.js environment

        <details>
          <summary><code>npx next info</code> output</summary>

        ```text
        Paste the command output here.
        ```

        </details>

        ### TypeScript configuration

        <details>
          <summary><code>tsconfig.json</code></summary>

        ```json
        Paste your tsconfig.json contents here.
        ```

        </details>

        ### Browser

        Name and version:
      render: markdown
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 📎 Additional context
      description: Screenshots or anything else that may help.
