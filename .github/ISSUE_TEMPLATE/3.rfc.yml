name: 💬 RFC
description: Propose a significant change or new direction for the project.
title: '[RFC]: '
labels: ['rfc']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a significant change! ❤️

        RFCs are intended for substantial changes that may affect the project's
        architecture, APIs, conventions, tooling, or overall direction.

        Before opening an RFC, please check whether a similar proposal or discussion
        already exists.

  - type: textarea
    id: problem
    attributes:
      label: ❓ What's the problem?
      description: |
        Briefly explain the problem or opportunity this RFC addresses.
        Describe what you are trying to accomplish and the outcomes you are aiming for.
      placeholder: |
        The problem is...

        We are trying to...
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 📋 What are the requirements?
      description: |
        List the requirements that should be met by the accepted proposal.
      placeholder: |
        The proposal should:
        - ...
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 🔄 What are our options?
      description: |
        Describe the alternative approaches that could achieve the desired outcome.
      placeholder: |
        Possible approaches:
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 💡 Proposed solution
      description: |
        This is the core of the RFC. Clearly explain your proposed solution
        and why it is preferred over the alternatives.

        Consider:
        - using diagrams to illustrate your ideas
        - including code examples for interfaces or system contracts
        - linking to relevant project briefs, prototypes, or wireframes
      placeholder: |
        I propose that we...

        Why this approach:
        ...
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: ⚠️ Trade-offs / risks
      description: |
        Describe potential drawbacks, breaking changes, migration costs,
        maintenance burden, or other risks introduced by the proposal.
      placeholder: |
        Potential trade-offs or risks:
        - ...
        - ...
    validations:
      required: false

  - type: textarea
    id: resources
    attributes:
      label: 📚 Resources and benchmarks
      description: |
        Add relevant issues, pull requests, documentation, benchmarks,
        external references, experiments, or other supporting material.
      placeholder: |
        - ...
        - ...
    validations:
      required: false
