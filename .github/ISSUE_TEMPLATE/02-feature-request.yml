name: ✨ Feature request
description: Suggest a new feature or improvement for the project.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        🙏 Thanks for the suggestion. Please search existing issues first to avoid duplicates.
  - type: checkboxes
    id: latest-version
    attributes:
      label: Latest version
      description: New releases may already include the requested feature or improvement.
      options:
        - label: I have checked the latest version.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem
      description: What problem would this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed solution
      description: Describe what you would like to see added or changed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives considered
      description: Other approaches or tools you have considered.
  - type: textarea
    id: additional
    attributes:
      label: 📎 Additional context
      description: Links, examples or anything else that may help.
